# GitHub Actions: Build and deploy one-api to Google Cloud Run
# Required repo secrets:
# - GCP_PROJECT: GCP project id
# - GCP_SA_KEY: JSON service account key (base64 or raw JSON) with Cloud Run, Artifact Registry or Storage, and Service Account User roles
# - CLOUD_RUN_REGION: e.g. us-central1
# - ONEAPI_JWT_SECRET: random secret for one-api session signing
# - OPENAI_API_KEY: (optional) initial provider key to seed a Channel

name: Build and Deploy to Cloud Run
on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Configure Docker credential helper
        run: |
          gcloud auth configure-docker --quiet

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: gcr.io/${{ secrets.GCP_PROJECT }}/one-api:${{ github.sha }}

      - name: Deploy to Cloud Run
        env:
          IMAGE: gcr.io/${{ secrets.GCP_PROJECT }}/one-api:${{ github.sha }}
        run: |
          # Deploy service. Environment variables can be supplied from GitHub secrets.
          gcloud run deploy one-api \
            --image "$IMAGE" \
            --region "${{ secrets.CLOUD_RUN_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars NODE_ENV=production,ONEAPI_JWT_SECRET=${{ secrets.ONEAPI_JWT_SECRET }},OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
            --project "${{ secrets.GCP_PROJECT }}"
